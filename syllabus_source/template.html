---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(title)$$title$$else$CS 377 Syllabus$endif$</title>
  <style>
    :root {
      --blue: #00a1de;
      --blue-dark: #005daa;
      --ink: #231f20;
      --paper: #fff;
      --soft: #f4f4f4;
      --border: #d8d8d8;
    }
    * { box-sizing: border-box; }
    html { color: var(--ink); background: var(--soft); font: 17px/1.55 FreeSans, Helvetica, Arial, sans-serif; }
    body { position: relative; max-width: 900px; margin: 0 auto; padding: 0 4rem 5rem; background: var(--paper); }
    body::before {
      content: "DRAFT";
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 0;
      color: rgba(35, 31, 32, .055);
      font-size: clamp(5rem, 16vw, 11rem);
      font-weight: 900;
      letter-spacing: .08em;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(-28deg);
      white-space: nowrap;
    }
    body > * { position: relative; z-index: 1; }
    header { padding-top: 1.5rem; text-align: center; }
    h1, h2, h3 { line-height: 1.15; }
    header h1 { margin: 0; font-size: 2rem; }
    header .course-line { margin: .5rem 0 0; font-size: 1.3rem; font-weight: 700; }
    header .epigraph { margin: .5rem 0 0; font-style: italic; }
    header .term { margin: .5rem 0 0; font-size: 1.15rem; }
    main h1 { margin-top: 2.5rem; padding: .5rem .75rem; border: 1px solid var(--ink); background: #c8c8c8; font-size: 1.5rem; }
    h2 { margin-top: 1.8rem; margin-bottom: .4rem; font-size: 1.15rem; }
    h2 + p, h2 + ul, h2 + table { margin-top: 0; }
    a { color: var(--blue-dark); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .55rem; border: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--soft); }
    nav { margin: 2rem 0; padding: 1rem 1.25rem; background: var(--soft); border-left: 6px solid var(--blue); }
    nav ul { columns: 2; }
    .meta { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; color: #666; font-size: .85rem; }
    @media (max-width: 700px) {
      body { padding: 2rem 1.25rem 4rem; }
      nav ul { columns: 1; }
      .meta { display: block; }
      table { font-size: .85rem; }
    }
    @media print {
      html { background: #fff; font-size: 11pt; }
      body { max-width: none; padding: 0; }
      body::before { color: rgba(35, 31, 32, .07); }
    }
  </style>
</head>
<body>
  {% include masthead.html %}
  <header>
    <div class="meta">
      <span>Generated $created$</span>
      <span><a href="syllabus.pdf">PDF version</a> · <a href="https://doethics.fun/">Course site</a></span>
    </div>
    <h1>$college$</h1>
    <p class="course-line">$course$ &nbsp; $course-title$ &nbsp; ($credit-hours$ Credit Hours)</p>
    <p class="epigraph">$epigraph$</p>
    <p class="term">$term$</p>
  </header>
  $if(toc)$<nav aria-label="Table of contents">$toc$</nav>$endif$
  <main>$body$</main>
</body>
</html>
