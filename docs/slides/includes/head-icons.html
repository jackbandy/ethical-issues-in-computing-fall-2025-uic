<!-- Tab identity for the decks, matching the rest of the site. Injected by
     slides/_metadata.yml (include-in-header); the built week*.html are Quarto
     output, so edit this file and re-run slides/build.sh rather than them.

     The icon hrefs are relative to slides/ rather than site-root-absolute: the
     decks render with embed-resources, so pandoc reads each one off disk and
     inlines it as a data URI. A leading "/" makes it look for the file at the
     filesystem root and the render fails. The og:image stays an absolute URL --
     scrapers fetch it over the network and cannot use a data URI. -->
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../assets/branding/loop-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/branding/apple-touch-icon.png">
<meta name="theme-color" content="#00A1DE">
<meta property="og:image" content="https://doethics.fun/assets/branding/blue-line-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://doethics.fun/assets/branding/blue-line-og.png">
