<script>
// Attendance warm-up: draw one true-random uppercase letter from random.org.
// Styling lives in theme/random-letter.css. No-ops on decks that have no
// .random-letter panel.
//
// random.org refuses to be framed (X-Frame-Options: SAMEORIGIN, CSP
// frame-ancestors 'self'), so the letter cannot come from an <iframe>. It does
// send Access-Control-Allow-Origin: *, so the panel fetches the plain-text
// response instead — the same approach as the random roll call in the
// data-science-fun deck.
(() => {
  const ENDPOINT = "https://www.random.org/strings/?num=1&len=1&upperalpha=on&unique=on&format=plain&rnd=new";

  function setup(root) {
    if (root.dataset.wired) return;
    root.dataset.wired = "1";

    const display = root.querySelector(".random-letter-display");
    const button = root.querySelector(".random-letter-button");
    const status = root.querySelector(".random-letter-status");
    if (!display || !button) return;

    function placeholder(text) {
      display.innerHTML = "";
      const p = document.createElement("div");
      p.className = "random-letter-placeholder";
      p.textContent = text;
      display.appendChild(p);
    }

    function render(letter) {
      display.innerHTML = "";
      const cell = document.createElement("div");
      cell.className = "random-letter-value";
      cell.textContent = letter;
      display.appendChild(cell);
    }

    function draw() {
      button.disabled = true;
      status.textContent = "drawing from random.org…";
      fetch(ENDPOINT, { cache: "no-store" })
        .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then((text) => {
          const letter = text.trim().split(/\s+/).filter(Boolean)[0];
          if (!letter) throw new Error("empty response");
          render(letter);
          status.textContent = "a true random letter from random.org";
        })
        .catch((err) => {
          placeholder("Could not reach random.org (" + err.message + "). Open the draw in a new tab instead.");
          status.textContent = "";
        })
        .then(() => { button.disabled = false; });
    }

    button.addEventListener("click", draw);
    placeholder(display.dataset.placeholder || "Press “Draw” for a random letter.");
  }

  function init() {
    document.querySelectorAll(".random-letter").forEach(setup);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
