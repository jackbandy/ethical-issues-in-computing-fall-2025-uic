<!doctype html>
<!--
  /slides/ used to be a hand-maintained index of every deck. The schedule page
  now lists each week's deck alongside what that week covers, so this file is
  just a redirect: it catches old bookmarks and the fallback URL in the deck
  footers (docs/slides/_metadata.yml). Individual decks — /slides/week1.html and
  friends — are unaffected.

  Plain meta-refresh rather than jekyll-redirect-from, so there is no plugin to
  install and GitHub Pages needs no extra configuration.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slides — Blue Line Ethics</title>
  <link rel="canonical" href="https://doethics.fun/schedule.html">
  <meta http-equiv="refresh" content="0; url={{ site.baseurl }}/schedule.html">
  <meta name="robots" content="noindex">
</head>
<body>
  <p>The slide decks are listed week by week on the
    <a href="{{ site.baseurl }}/schedule.html">course schedule</a>.</p>
</body>
</html>
