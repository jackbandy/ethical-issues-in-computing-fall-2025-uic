format:
  revealjs:
    embed-resources: true
    theme: theme/blue-line.scss
    css: theme/responsive-footer.css
    include-after-body:
      - includes/slide-number-after-body.html
      - includes/footer-deck-link.html
    width: 1280
    height: 720
    margin: 0
    slide-number: c/t
    controls: true
    progress: false
    transition: fade
    background-transition: fade
    footer: '<img src="../images/uic-black-logo.svg" alt="UIC logo"><img src="../images/cc-by-nc-sa-small.svg" alt="CC BY-NC-SA"><span class="footer-text">CS 377 · Ethical Issues in Computing</span><span class="footer-text"><a href="https://doethics.fun/slides/">doethics.fun/slides</a></span>'
bibliography: references.bib
slide-level: 1
