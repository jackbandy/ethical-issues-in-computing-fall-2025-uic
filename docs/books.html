<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Gallery - Student Selections for Ethical Issues in Computing</title>
<link rel="stylesheet" href="books.css">
<link rel="stylesheet" href="{{ site.baseurl }}/css/site-nav.css">
</head>
<body>
{% include site-nav.html nav_current="books" %}
<div class="top-bar">
  <h1>Book Gallery – Ethical Issues in Computing</h1>
  <button onclick="shuffleBooks()">🔀 Shuffle</button>
  <button onclick="sortBooks()">Sort A–Z</button>
  <label class="show-all"><input type="checkbox" id="showAll" onchange="renderCurrent()"> Show All Books</label>
</div>
<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="side-panel" id="sidePanel">
  <button class="panel-close" onclick="closePanel()">&times;</button>
  <div id="panelContent"></div>
</div>

<script src="books-data.js"></script>

{% include masthead.html %}

<div class="footnotes">
  <a href="https://jackbandy.com/text/llm-code-philosophy.html">Made with help from LLMs</a>
  <a href="https://bookshop.org/lists/ethical-issues-in-computing" target="_blank" rel="noopener">View on Bookshop (this gallery includes affiliate links)</a>
</div>
<script>
const AFFILIATE_ID = "122922";
function affiliateLink(isbn) {
  return `https://bookshop.org/a/${AFFILIATE_ID}/${isbn}`;
}

// The same book on Bookshop, with no referral tag attached. Prefers the
// product URL recorded in books.csv; falls back to an ISBN search.
function plainLink(book) {
  return book.Link || `https://bookshop.org/search?keywords=${book.ISBN}`;
}

function renderGallery(bookList) {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  if (bookList.length === 0) {
    gallery.innerHTML = '<p class="gallery-empty">No books are featured right now \u2014 check "Show All Books" to see the full shelf.</p>';
    return;
  }
  bookList.forEach(book => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${book.Image}" alt="${book.Title}" loading="lazy">
      <h3>${book.Title}</h3>
      <p>${book.Author}</p>
    `;
    card.addEventListener("click", () => openPanel(book));
    gallery.appendChild(card);
  });
}

function stars(n) {
  return "\u2605".repeat(n) + "\u2606".repeat(5 - n);
}

function openPanel(book) {
  const reviews = book.reviews && book.reviews.length > 0
    ? book.reviews.map(r => `
        <div class="review">
          <div class="review-meta">${r.reviewer} <span class="review-stars">${stars(r.rating)}</span></div>
          <p>${r.text}</p>
        </div>`).join("")
    : '<p class="no-reviews">No reviews yet.</p>';

  document.getElementById("panelContent").innerHTML = `
    <img class="panel-cover" src="${book.Image}" alt="${book.Title}">
    <h2 class="panel-title">${book.Title}</h2>
    <p class="panel-author">${book.Author}</p>
    <p class="panel-isbn">ISBN: ${book.ISBN}</p>
    <div class="panel-links">
      <a class="panel-link" href="${affiliateLink(book.ISBN)}" target="_blank" rel="noopener noreferrer">Bookshop.org &mdash; affiliate link &rarr;</a>
      <a class="panel-link" href="${plainLink(book)}" target="_blank" rel="noopener noreferrer">Bookshop.org &mdash; plain link &rarr;</a>
    </div>
    <p class="panel-links-note">(Both go to the same book for the same price. The affiliate link credits this course; the plain link has no referral tag.)</p>
    <div class="reviews-heading">
      <h3>Reviews from students who chose this book (${book.reviews ? book.reviews.length : 0})</h3>
      ${reviews}
    </div>
  `;
  document.getElementById("sidePanel").classList.add("open");
  document.getElementById("overlay").classList.add("visible");
}

function closePanel() {
  document.getElementById("sidePanel").classList.remove("open");
  document.getElementById("overlay").classList.remove("visible");
}

// Books marked `elevate: true` are always on display. The rest are held back
// until "Show All Books" is checked.
function visibleBooks() {
  const showAll = document.getElementById("showAll").checked;
  return showAll ? books : books.filter(b => b.elevate);
}

// Which ordering the gallery is currently in, so toggling the checkbox
// re-filters without silently reshuffling the shelf under the reader.
let currentOrder = "shuffle";

function renderCurrent() {
  if (currentOrder === "sort") sortBooks(); else shuffleBooks();
}

function shuffleBooks() {
  currentOrder = "shuffle";
  const shuffled = [...visibleBooks()].sort(() => Math.random() - 0.5);
  renderGallery(shuffled);
}

function sortBooks() {
  currentOrder = "sort";
  const sorted = [...visibleBooks()].sort((a, b) => a.Title.localeCompare(b.Title));
  renderGallery(sorted);
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
shuffleBooks();
</script>
</body>
</html>
