<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="618" viewBox="0 0 1000 618" font-family="'Big Shoulders','Arial Narrow','Helvetica Neue Condensed',sans-serif">
  <rect width="1000" height="618" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="8" fill="#00a1de"/>
  <text x="60" y="92" font-size="40" font-weight="700" fill="#231f20" letter-spacing="0.5">MINIMAL PALETTE — CTA BLUE LINE</text>
  <text x="60" y="126" font-size="18" fill="#666666" font-family="'Mulish',FreeSans,Helvetica,Arial,sans-serif">Brand accent + neutrals. Blue carries focus; red is a sparing accent.</text>

  <g font-family="'IBM Plex Mono','Courier New',monospace">
    <g>
      <rect x="60"  y="180" width="92" height="210" fill="#00a1de"/>
      <rect x="160" y="180" width="92" height="210" fill="#005daa"/>
      <rect x="260" y="180" width="92" height="210" fill="#003087"/>
      <rect x="360" y="180" width="92" height="210" fill="#c60c30"/>
      <rect x="460" y="180" width="92" height="210" fill="#231f20"/>
      <rect x="560" y="180" width="92" height="210" fill="#333333"/>
      <rect x="660" y="180" width="92" height="210" fill="#666666"/>
      <rect x="760" y="180" width="92" height="210" fill="#f4f4f4" stroke="#d8d8d8"/>
      <rect x="860" y="180" width="80" height="210" fill="#ffffff" stroke="#d8d8d8"/>
    </g>
    <g font-size="13" fill="#231f20" font-family="'Mulish',FreeSans,Helvetica,Arial,sans-serif">
      <text x="60"  y="418" font-weight="700">cta-blue*</text>
      <text x="160" y="418" font-weight="700">blue-dark</text>
      <text x="260" y="418" font-weight="700">blue-deep</text>
      <text x="360" y="418" font-weight="700">cta-red*</text>
      <text x="460" y="418" font-weight="700">ink</text>
      <text x="560" y="418" font-weight="700">charcoal</text>
      <text x="660" y="418" font-weight="700">muted</text>
      <text x="760" y="418" font-weight="700">soft</text>
      <text x="860" y="418" font-weight="700">paper</text>
    </g>
    <g font-size="13" fill="#666666">
      <text x="60"  y="440">#00A1DE</text>
      <text x="160" y="440">#005DAA</text>
      <text x="260" y="440">#003087</text>
      <text x="360" y="440">#C60C30</text>
      <text x="460" y="440">#231F20</text>
      <text x="560" y="440">#333333</text>
      <text x="660" y="440">#666666</text>
      <text x="760" y="440">#F4F4F4</text>
      <text x="860" y="440">#FFFFFF</text>
    </g>
  </g>

  <text x="60" y="560" font-size="15" fill="#666666" font-family="'Mulish',FreeSans,Helvetica,Arial,sans-serif">* cta-blue = official CTA <tspan font-weight="700">Blue Line #00A1DE</tspan>; cta-red = official CTA <tspan font-weight="700">Red Line #C60C30</tspan>. (blue-dark/deep are derived shades.)</text>
  <text x="60" y="586" font-size="13" fill="#aaaaaa" font-family="'IBM Plex Mono',monospace">Original work · colors per CTA Trademark Guidelines for Developers · no CTA marks used</text>
</svg>
