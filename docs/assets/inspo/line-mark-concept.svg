<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="618" viewBox="0 0 1000 618" font-family="'Big Shoulders','Arial Narrow','Helvetica Neue Condensed',sans-serif">
  <rect width="1000" height="618" fill="#ffffff"/>
  <rect x="0" y="0" width="8" height="618" fill="#00a1de"/>

  <!-- distilled logo mark: a blue route segment that turns, with two stops -->
  <g transform="translate(500 300)">
    <path d="M -110 90 L -110 -10 C -110 -34 -94 -50 -70 -50 L 40 -50 C 64 -50 80 -66 80 -90"
          fill="none" stroke="#00a1de" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-110" cy="60" r="17" fill="#ffffff" stroke="#00a1de" stroke-width="9"/>
    <circle cx="-20" cy="-50" r="17" fill="#ffffff" stroke="#00a1de" stroke-width="9"/>
    <circle cx="80" cy="-90" r="13" fill="#00a1de"/>
  </g>

  <text x="500" y="500" text-anchor="middle" font-size="34" font-weight="700" fill="#231f20" letter-spacing="1">LINE MARK</text>
  <text x="500" y="534" text-anchor="middle" font-size="17" fill="#666666" font-family="'Mulish',FreeSans,Helvetica,Arial,sans-serif">the transit motif distilled to a compact mark — rounded joins, ringed stops</text>
  <text x="500" y="592" text-anchor="middle" font-size="13" fill="#aaaaaa" font-family="'IBM Plex Mono',monospace">Original mark · CTA Blue Line color #00A1DE · not a CTA logo or approximation</text>
</svg>
