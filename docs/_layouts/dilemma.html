<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00A1DE">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{ page.title }} — Blue Line Ethics</title>
  {% if page.summary %}<meta name="description" content="{{ page.summary | escape }}">{% endif %}
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/index.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/dilemmas.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/site-nav.css">
</head>
<body class="dilemma-page">
  {% include site-nav.html nav_current="dilemmas" %}

  <main class="dilemma-detail-main">
    <p class="dilemma-breadcrumb"><a href="{{ site.baseurl }}/dilemmas/">&larr; All dilemmas</a></p>
    <article>
      <h1 class="panel-title">{{ page.title }}</h1>
      <div class="dilemma-body">
        {{ content }}
      </div>
    </article>
  </main>

  {% include masthead.html %}
  {% include footer.html %}

  <script>
    const contextToggle = document.querySelector(".context-toggle");
    if (contextToggle) {
      const context = document.getElementById("dilemmaContext");
      contextToggle.addEventListener("click", () => {
        const expanded = contextToggle.getAttribute("aria-expanded") === "true";
        contextToggle.setAttribute("aria-expanded", String(!expanded));
        context.hidden = expanded;
        contextToggle.textContent = expanded ? "Show sources and context" : "Hide sources and context";
      });
    }
  </script>
</body>
</html>
