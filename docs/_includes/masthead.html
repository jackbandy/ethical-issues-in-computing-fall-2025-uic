<style>
  /* ── Masthead train drift — adjust these ─────────────────────────────
     --masthead-drift-duration : time for one edge-to-edge sweep. The animation
                                 alternates, so the full back-and-forth round trip
                                 is twice this (32s → 64s there-and-back).
     --masthead-drift-reach    : how far past the content box the train travels.
     --masthead-train-height   : rendered height of the train car artwork.        */
  :root {
    --masthead-drift-duration: 32s;
    --masthead-drift-reach: 0px;
    --masthead-train-height: 96px;
  }

  .ble-masthead {
    display: block;
    margin: 0 0 2rem;
    color: inherit;
    text-decoration: none;   /* whole masthead is a link to the homepage */
  }
  .ble-masthead__inner {
    /* Full width so the train can drift all the way to each screen edge. */
    max-width: none;
    margin: 0 auto;
    padding: 14px 0 0;
    overflow: hidden;   /* clip the train as it slides to the edges */
    line-height: 0;     /* no baseline gap beneath the artwork */
  }
  .ble-masthead__train {
    display: block;
    height: var(--masthead-train-height);
    width: auto;
    position: relative;
    /* The v4c artwork has ~17% empty space below the wheels (viewBox 0–400,
       wheels rest at y≈332). Pull the blue bar up by that much so the wheels
       sit directly on the line, like rails. */
    margin-bottom: calc(var(--masthead-train-height) * -0.17);
    /* Slowly roll from the left edge to the right edge and back, forever. */
    animation: ble-train-drift var(--masthead-drift-duration) ease-in-out infinite alternate;
    will-change: left, transform;
  }
  /* Travel is measured against the container (left 0 → 100%), so the train's
     trailing edge stops at the content box and never overshoots the viewport,
     regardless of scrollbar width. */
  @keyframes ble-train-drift {
    from { left: 0;    transform: translateX(0); }
    to   { left: 100%; transform: translateX(calc(-100% + var(--masthead-drift-reach))); }
  }
  .ble-masthead__bar {
    border: none;
    height: 12px;
    background-color: #00A1DE;
    width: 100vw;
    margin: 0 0 0 calc(50% - 50vw);
  }
  @media (prefers-reduced-motion: reduce) {
    .ble-masthead__train { animation: none; }
  }
</style>
<a class="ble-masthead" href="{{ site.baseurl }}/">
  <div class="ble-masthead__inner">
    <img class="ble-masthead__train"
         src="{{ site.baseurl }}/assets/trains/blue-line-ethics-masthead-v4c.svg"
         alt="Blue Line Ethics">
  </div>
  <hr class="ble-masthead__bar">
</a>
