<!--
  Site header: course title plus the main menu, sandwiched between two blue
  rails (the Blue Line). Include this at the very top of <body>; it replaces the
  hand-rolled title block that used to live in each page.

  Pass `nav_current` from the including page to mark the active link — an
  include tag with nav_current="schedule", "syllabus", "about", and so on. (Liquid
  runs tags even inside HTML comments, so that example can't be spelled out
  here: it would include this file inside itself.)

  The menu sits on a single line at every width it fits on. When it no longer
  fits, the script in _includes/site-nav-script.html puts `is-compact` on
  `.site-masthead`, which shrinks the title and swaps the links for the round
  hamburger button.

  Styles live in css/site-nav.css so pages with their own stylesheet (the
  generated syllabus, the timer) can wear the header without pulling in
  index.css.

  Note: this file was largely written by an LLM (Claude Code).
-->
{% assign nav_current = include.nav_current %}
<hr class="blue-line">
<div class="site-masthead">
  <div class="site-masthead-bar">
    <h1><a href="{{ site.baseurl }}/">Ethical Issues in Computing (CS 377)</a></h1>
    <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-menu" aria-label="Menu">
      <span class="site-nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
  </div>
  <nav class="site-nav" id="site-nav-menu" aria-label="Main">
    <a href="{{ site.baseurl }}/"{% if nav_current == "schedule" %} aria-current="page"{% endif %}>Schedule</a>
    <a href="{{ site.baseurl }}/syllabus/"{% if nav_current == "syllabus" %} aria-current="page"{% endif %}>Syllabus</a>
    <a href="{{ site.baseurl }}/slides/"{% if nav_current == "slides" %} aria-current="page"{% endif %}>Slides</a>
    <a href="{{ site.baseurl }}/dilemmas/"{% if nav_current == "dilemmas" %} aria-current="page"{% endif %}>Dilemmas</a>
    <a href="{{ site.baseurl }}/books.html"{% if nav_current == "books" %} aria-current="page"{% endif %}>Books</a>
    <a href="{{ site.baseurl }}/faq.html"{% if nav_current == "faq" %} aria-current="page"{% endif %}>FAQ</a>
    <a class="is-external" href="{{ site.baseurl }}/timer/" target="_blank" rel="noopener">Timer</a>
    <a class="site-nav-info" href="{{ site.baseurl }}/about.html"{% if nav_current == "about" %} aria-current="page"{% endif %} aria-label="About this site">
      <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5 32a27 27 0 1 1 54 0a27 27 0 1 1-54 0Z M39.56 15.81C39.56 13.65 37.76 11.85 35.55 11.85C33.57 11.85 31.77 13.65 31.77 15.63C31.77 17.9 33.4 19.64 35.61 19.64C37.82 19.64 39.56 17.96 39.56 15.81ZM36.89 43.38 36.07 44.54C34.5 46.75 33.22 48.09 32.35 48.09C31.89 48.09 31.48 47.86 31.48 47.16C31.48 46.63 31.71 45.18 32 44.19L37.29 24.76C34.15 25.46 30.02 26.04 25.49 26.39V27.96H26.3C28.05 27.96 28.98 28.54 28.98 29.65C28.98 30.11 28.86 30.87 28.51 32.27L25.31 44.07C24.73 46.17 24.44 47.68 24.44 48.5C24.44 51 26.01 52.16 28.4 52.16C31.89 52.16 34.33 50.47 38.17 44.19Z"/></svg>
      <span class="site-nav-info-label">About</span>
    </a>
  </nav>
</div>
<hr class="blue-line">
{% include site-nav-script.html %}
